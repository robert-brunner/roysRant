backend:
  name: github
  repo: robert-brunner/roysRant
  branch: Decap
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: public/images
public_folder: /images

collections:
  - name: articles
    label: Articles
    label_singular: Article
    folder: src/components/method2/articles
    extension: json
    format: json
    create: true
    delete: false
    identifier_field: title
    summary: "{{title}} — /{{slug}}"
    slug: "{{fields.slug}}"
    preview_path: "{{slug}}"
    fields:
      - label: Page Address
        name: slug
        widget: string
        hint: "Example: joint-health creates roysrant.com/joint-health"
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          - "Use lowercase letters, numbers, and hyphens only."
      - { label: Title, name: title, widget: string }
      - { label: Subtitle, name: subtitle, widget: string, required: false }
      - label: Category
        name: category
        widget: select
        options:
          - { label: "Health & Nutrition", value: health }
          - { label: "Politics & Economics", value: politics }
          - { label: More, value: more }
      - { label: Body, name: body, widget: tiptap }
